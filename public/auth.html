<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f53">
  <title>Account Access</title>
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#17324a;background:#eef4f7;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 10%,#d9f2ed 0,transparent 34%),linear-gradient(135deg,#eef4f7,#e7eff5)}
    .shell{width:min(100%,960px);min-height:570px;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px #1a38521c}
    .intro{padding:54px 48px;background:linear-gradient(150deg,#123f53,#176d72);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
    .brand{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.88}.intro h1{font-size:clamp(32px,4vw,48px);line-height:1.08;margin:90px 0 18px;letter-spacing:-.04em}.intro p{max-width:350px;color:#d7eeec;line-height:1.7;margin:0}.hint{font-size:13px;color:#c4e2df;margin-top:64px}
    .panel{padding:48px clamp(26px,5vw,64px);display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#27837e}.panel h2{font-size:30px;margin:10px 0 8px;letter-spacing:-.03em}.sub{color:#687b89;font-size:14px;margin:0 0 28px;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f5f6;padding:4px;border-radius:12px;margin-bottom:24px}.tab{border:0;background:transparent;padding:11px;border-radius:9px;font:inherit;color:#627482;font-weight:650;cursor:pointer}.tab.active{background:#fff;color:#164d5b;box-shadow:0 2px 8px #183a4912}
    form{display:grid;gap:15px}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:650;color:#334c5c}.field input{height:46px;border:1px solid #d8e2e7;border-radius:10px;padding:0 13px;font:inherit;color:#183345;outline:none}.field input:focus{border-color:#27837e;box-shadow:0 0 0 3px #27837e20}.submit{height:48px;border:0;border-radius:10px;background:#176d72;color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:4px;box-shadow:0 8px 18px #176d7227}.submit:hover{background:#125a60}.submit:disabled{opacity:.65;cursor:wait}.message{min-height:20px;margin:2px 0 0;font-size:13px;color:#a22}.message.ok{color:#187248}.legal{font-size:11px;line-height:1.5;color:#788995;margin-top:18px} [hidden]{display:none!important}
    @media(max-width:700px){body{padding:14px}.shell{grid-template-columns:1fr;min-height:0}.intro{padding:28px 30px}.intro h1{margin:36px 0 12px;font-size:34px}.intro p{font-size:14px}.hint{margin-top:24px}.panel{padding:32px 28px 36px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="intro" aria-label="Welcome">
      <div class="brand">Student Portal</div>
      <div><h1>Learning starts with a secure sign in.</h1><p>Create an account or sign in to continue to the home page.</p></div>
      <div class="hint">Your password is protected before it is saved.</div>
    </section>
    <section class="panel">
      <div class="eyebrow">Welcome</div>
      <h2 id="heading">Sign in to your account</h2>
      <p class="sub" id="subheading">Enter your details to continue.</p>
      <div class="tabs" role="tablist" aria-label="Account options">
        <button class="tab active" id="loginTab" type="button" role="tab" aria-selected="true">Sign in</button>
        <button class="tab" id="registerTab" type="button" role="tab" aria-selected="false">Create account</button>
      </div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="loginEmail">Email address</label><input id="loginEmail" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required></div>
        <button class="submit" type="submit">Sign in</button>
        <p class="message" id="loginMessage" aria-live="polite"></p>
      </form>
      <form id="registerForm" hidden novalidate>
        <div class="field"><label for="fullName">Full name</label><input id="fullName" name="name" type="text" maxlength="80" autocomplete="name" required></div>
        <div class="field"><label for="registerEmail">Email address</label><input id="registerEmail" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="registerPassword">Password</label><input id="registerPassword" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
        <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
        <button class="submit" type="submit">Create account</button>
        <p class="message" id="registerMessage" aria-live="polite"></p>
      </form>
      <div class="legal">By continuing, you agree to use this account responsibly.</div>
    </section>
  </main>
  <script>
    const loginTab=document.querySelector('#loginTab');
    const registerTab=document.querySelector('#registerTab');
    const loginForm=document.querySelector('#loginForm');
    const registerForm=document.querySelector('#registerForm');
    const heading=document.querySelector('#heading');
    const subheading=document.querySelector('#subheading');
    function showMode(mode){
      const registering=mode==='register';
      loginForm.hidden=registering; registerForm.hidden=!registering;
      loginTab.classList.toggle('active',!registering); registerTab.classList.toggle('active',registering);
      loginTab.setAttribute('aria-selected',String(!registering)); registerTab.setAttribute('aria-selected',String(registering));
      heading.textContent=registering?'Create your account':'Sign in to your account';
      subheading.textContent=registering?'Enter your details to register.':'Enter your details to continue.';
      document.querySelector('#loginMessage').textContent=''; document.querySelector('#registerMessage').textContent='';
    }
    loginTab.addEventListener('click',()=>showMode('login'));
    registerTab.addEventListener('click',()=>showMode('register'));
    async function submitForm(form,action,messageElement,buttonLabel){
      const button=form.querySelector('button[type="submit"]');
      const message=document.querySelector(messageElement);
      const data=Object.fromEntries(new FormData(form).entries());
      message.className='message'; message.textContent=''; button.disabled=true; button.textContent='Please wait…';
      try{
        const response=await fetch(`/.netlify/functions/auth?action=${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        const result=await response.json();
        if(!response.ok) throw new Error(result.error||'Please check your details and try again.');
        window.location.assign('/index.html');
      }catch(error){message.textContent=error.message||'Could not connect. Please try again.';}
      finally{button.disabled=false;button.textContent=buttonLabel;}
    }
    loginForm.addEventListener('submit',event=>{event.preventDefault();submitForm(loginForm,'login','#loginMessage','Sign in');});
    registerForm.addEventListener('submit',event=>{event.preventDefault();submitForm(registerForm,'register','#registerMessage','Create account');});
    fetch('/.netlify/functions/auth?action=me').then(response=>{if(response.ok)window.location.replace('/index.html');}).catch(()=>{});
  </script>
</body>
</html>
